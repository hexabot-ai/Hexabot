packages:
  - "packages/agentic"
  - "packages/api"
  - "packages/types"
  - "packages/frontend"
  - "packages/graph"
  - "packages/cli"
  - "packages/widget"

nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false
ignoreWorkspaceRootCheck: true

allowBuilds:
  "@compodoc/compodoc": true
  "@nestjs/core": true
  "@parcel/watcher": true
  "@scarf/scarf": true
  "@swc/core": true
  better-sqlite3: true
  esbuild: true
  protobufjs: true
  tree-sitter: true
  unrs-resolver: true

overrides:
  "@ai-sdk/provider-utils": "^4.0.33"
  "@babel/core": "7.29.7"
  "@humanfs/node": "^0.16.8"
  "@opentelemetry/core": "2.8.0"
  "ajv@8": "8.20.0"
  "baseline-browser-mapping": "^2.11.0"
  "brace-expansion": ">=5.0.9"
  "browserslist": "^4.28.7"
  "dompurify": "3.4.13"
  "engine.io": "6.6.9"
  "fast-uri": "^3.1.6"
  "glob": "13.0.6"
  "@hono/node-server": ">=2.0.5"
  "hono": ">=4.13.5"
  "immutable": ">=5.1.8"
  "ip-address": "10.3.1"
  "js-yaml": "4.3.2"
  "jsonata": "^2.2.0"
  "lodash": "4.18.1"
  "lodash-es": "4.18.1"
  "minimatch": "10.2.5"
  "nanoid": "3.3.18"
  "nestjs-auditlog>@opentelemetry/auto-instrumentations-node": "0.75.0"
  "nestjs-auditlog>@opentelemetry/sdk-node": "0.217.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "openai>zod": "^3.23.8"
  "picomatch": "4.0.4"
  "postcss-selector-parser": "^7.1.3"
  "protobufjs": "7.6.5"
  # Keep a single React copy across the workspace (hoisted linker + externalized
  # react in the widget build both break if a transitive dep pulls its own copy).
  "react": "19.2.7"
  "react-dom": "19.2.7"
  "@types/react": "19.2.18"
  "@types/react-dom": "19.2.4"
  "shell-quote": ">=1.8.5"
  "svgo@>=4.0.0 <4.1.0": ">=4.1.0"
  "uuid": "11.1.1"
  "ws": "8.21.0"
  "multer": "2.3.0"
  "undici": "7.29.0"
  "postcss": "8.5.23"
  "socket.io-parser": "4.2.7"
  "qs": ">=6.16.0"
